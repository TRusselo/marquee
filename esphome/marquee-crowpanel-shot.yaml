# =============================================================================
#  Marquee panel — SCREENSHOT MODE   (PRIMARY, pixel-perfect)
#  Board: Elecrow CrowPanel Basic HMI 7.0"  (ESP32-S3-WROOM-1-N4R8, 800x480 RGB)
# =============================================================================
#  WHAT THIS DOES / WHAT YOU SEE:
#    A "dumb display" — it shows the REAL Marquee card, pixel-identical to the
#    Nest Hub, because the marquee-shot sidecar renders the actual card page with
#    headless Chromium and serves it as card.jpg. The panel just fetches that one
#    image full-screen. Nothing is reconstructed on-device (no LVGL, no layout).
#    Backlight: 40% while actively playing (cinema); 100% when paused; OFF when
#    idle/blank; tap-to-wake and a new title/episode brighten to 100% for 10 s.
#
#  REQUIRES THE SIDECAR (Chromium renderer) running on the Marquee host:
#      docker compose --profile panel up -d
#    It serves:  /card.jpg  (the 800x480 card)   and
#                /state.json {"ver":N,"playing":bool}  (cheap change signal)
#    See ../../sidecar/README.md for the sidecar and its env knobs.
#
#  PER-INSTALL: set `sidecar_host` below, and the `wifi:` block (secrets).
# =============================================================================

substitutions:
  sidecar_host: "192.168.1.12"     # <-- host running marquee-shot (your Marquee/Unraid box)
  sidecar_port: "8088"             # marquee-shot SERVE_PORT (/card.jpg + /state.json)
  poll_every: "2s"                 # poll the tiny /state.json. NOTE: 1s over-polls — a
                                   # card download+decode+redraw can't finish in 1s, so it
                                   # backs up and gets SLOWER. 2s is the sweet spot.


# =============================================================================
#  PART 1 — ESP32 / CrowPanel HARDWARE
#  Board, memory, radio, console, backlight, touch bus, and the RGB display.
#  Identical to the on-device examples' PART 1 (see ./examples/). Only the
#  per-install bits (sidecar_host above, wifi below) differ.
#  The display's `pages` lambda here is trivial — it just blits the fetched
#  card image full-screen (the real rendering happened in the sidecar).
# =============================================================================

esphome:
  name: marquee-panel
  friendly_name: Marquee Panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi     # QIO flash + OPI (octal) PSRAM
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # Pin IDF 5.5.1: ESPHome's default (5.5.x >= 5.5.2) has the wifi regression
    # (esphome#13443) -> 'Association Expired', flaky/no association. 5.5.1 is the
    # last good wifi build and still satisfies i2c's >= 5.4.2 requirement.
    version: 5.5.1
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y        # octal-PSRAM tuning for this board
      CONFIG_SPIRAM_RODATA: y

# PSRAM is REQUIRED (N4R8 = 8 MB OCTAL): the 800x480x2 (~768 KB) framebuffer +
# JPEG decode buffer for card.jpg live here, not in internal RAM.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none            # keep the radio up — avoids 'Association Expired' churn
  # DHCP by default. Optional: pin a static IP so the panel is easy to find for
  # OTA — uncomment and set to YOUR LAN.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

logger:
  # Force UART0 (GPIO43/44 -> CH340 -> /dev/ttyUSB0). ESPHome 2026.7 defaults the
  # console to USB_SERIAL_JTAG, whose pins (GPIO19/20) ARE this board's touch-i2c
  # bus -> i2c init kills the console. UART0 is the stable, non-conflicting channel.
  hardware_uart: UART0
api:
ota:
  - platform: esphome

http_request:
  id: http
  timeout: 8s
  watchdog_timeout: 12s
  useragent: marquee-panel
  verify_ssl: false                # sidecar is plain HTTP on the LAN

# Backlight on GPIO2. The poll loop (PART 2) dims it during playback.
output:
  - platform: ledc
    pin: 2
    frequency: 1220Hz
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms   # smooth backlight brightness changes

# Capacitive touch (GT911) shares this i2c bus — usable now that the console is
# on UART0 (GPIO19/20 are free). `scan: false` = don't enumerate at boot.
i2c:
  sda: 19
  scl: 20
  scan: false     # GT911 answers at the default 0x5D (polled touch works)

# Tap-to-wake. NOTE: `interrupt_pin: 38` was tried and CRASHED the boot (OTA
# rollback), so it's removed for now — this polled config boots but may not
# detect touches yet. The correct GT911 wiring for this board (interrupt/reset
# pin + i2c address 0x5D vs 0x14) still needs confirming (espboards PR #1494 /
# schematic). Everything else (idle-off, paused=100%, new-title wake) works
# without touch, driven by /state.json.
touchscreen:
  - platform: gt911
    id: touch
    on_touch:
      - lambda: "id(wake_until) = millis() + 10000;"   # 10 s wake window
      - script.execute: apply_backlight

# RGB parallel panel (Elecrow CrowPanel 7.0" timing/pins — verify vs YOUR unit).
display:
  - platform: rpi_dpi_rgb
    id: panel
    update_interval: never         # we redraw manually when a new card arrives
    auto_clear_enabled: false
    color_order: RGB
    pclk_inverted: true
    dimensions: {width: 800, height: 480}
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red:   [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue:  [15, 7, 6, 5, 4]
    # Trivial renderer: blit the fetched card full-screen, or black if none yet.
    pages:
      - id: page_card
        lambda: |-
          if (id(card_img).get_width() > 0) it.image(0, 0, id(card_img));
          else it.fill(Color::BLACK);


# =============================================================================
#  PART 2 — MARQUEE CARD  (application logic)
#  Fetch the sidecar's card image and show it. The panel stays dumb: it watches
#  the sidecar's version counter and only pulls the 64 KB image when it changes.
# =============================================================================

globals:
  - {id: prev_ver,       type: int,      restore_value: no, initial_value: "-1"}    # last /state.json frame ver
  - {id: prev_cver,      type: int,      restore_value: no, initial_value: "-1"}    # last content ver (title/episode)
  - {id: now_playing,    type: bool,     restore_value: no, initial_value: "false"} # for backlight
  - {id: now_paused,     type: bool,     restore_value: no, initial_value: "false"} # paused -> 100%
  - {id: card_dirty,     type: bool,     restore_value: no, initial_value: "false"} # ver changed -> refetch
  - {id: redraw_pending, type: bool,     restore_value: no, initial_value: "false"} # new image decoded -> redraw
  - {id: wake_until,     type: uint32_t, restore_value: no, initial_value: "0"}     # millis() until wake ends
  - {id: wake_pending,   type: bool,     restore_value: no, initial_value: "false"} # new title armed; wake starts on card draw
  - {id: bl_level,       type: int,      restore_value: no, initial_value: "-1"}    # last applied backlight %

# The card image itself, fetched on demand from the sidecar (not on a timer).
online_image:
  - id: card_img
    url: "http://${sidecar_host}:${sidecar_port}/card.jpg"
    format: JPEG
    type: RGB565
    resize: 800x480
    update_interval: never
    on_download_finished:
      - lambda: "id(redraw_pending) = true;"

# Backlight policy in ONE place so tap, the poll loop, and card redraws all use
# the same rule:
#   wake window (tap / new title) -> 100%   ·   paused -> 100%
#   actively playing -> 40% (cinema dim)    ·   idle / blank -> OFF
script:
  - id: apply_backlight
    then:
      - lambda: |-
          uint32_t now = millis();
          int target;
          if ((int32_t)(id(wake_until) - now) > 0) target = 100;   // wake window active
          else if (!id(now_playing))               target = 0;     // idle / blank -> off
          else if (id(now_paused))                 target = 100;   // paused
          else                                     target = 40;    // playing = cinema dim
          if (target != id(bl_level)) {
            id(bl_level) = target;
            if (target == 0) {
              id(backlight).turn_off().perform();
            } else {
              auto call = id(backlight).turn_on();
              call.set_brightness(target / 100.0f);
              call.perform();
            }
          }

# The poll loop: check the sidecar's cheap /state.json every ${poll_every}; pull
# the card only when its frame version bumps. The 10 s "new title" wake is
# DEFERRED to when the new card is actually drawn (download+decode takes ~2 s),
# so the brighten lines up with the visible card change rather than preceding it.
interval:
  - interval: ${poll_every}
    then:
      - http_request.get:
          url: "http://${sidecar_host}:${sidecar_port}/state.json"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  int ver = -1, cver = -1; bool playing = false, paused = false;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    ver     = root["ver"]     | -1;
                    cver    = root["cver"]    | -1;
                    playing = root["playing"] | false;
                    paused  = root["paused"]  | false;
                    return true;
                  });
                  id(now_playing) = playing;
                  id(now_paused)  = paused;
                  if (ver != id(prev_ver)) { id(prev_ver) = ver; id(card_dirty) = true; }
                  if (cver != id(prev_cver)) {
                    // New title/episode: ARM a wake (started on card draw below).
                    // Skip the first sync at boot (prev_cver == -1).
                    if (id(prev_cver) != -1) id(wake_pending) = true;
                    id(prev_cver) = cver;
                  }
              - if:                              # frame changed -> pull the new card
                  condition:
                    lambda: "return id(card_dirty);"
                  then:
                    - lambda: "id(card_dirty) = false;"
                    - component.update: card_img   # blocks ~2s; sets redraw_pending on finish
      # Redraw the freshly-decoded card, and START the wake clock now if a new
      # title was armed — so the brighten coincides with the card appearing.
      - if:
          condition:
            lambda: "return id(redraw_pending);"
          then:
            - lambda: |-
                id(redraw_pending) = false;
                if (id(wake_pending)) { id(wake_pending) = false; id(wake_until) = millis() + 10000; }
            - component.update: panel
      # Re-evaluate the backlight every tick (catches wake-window expiry too).
      - script.execute: apply_backlight
