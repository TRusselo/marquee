# Cinematic LVGL panel for the Elecrow CrowPanel ESP32-S3 7" (800x480 RGB, GT911).
# Built in layers; keep marquee-crowpanel.yaml as the known-good fallback.
# TASK 4 = base only: prove LVGL + RGB + PSRAM boots stably before adding content.
substitutions:
  marquee_host: "192.168.1.12"      # <-- your Marquee server LAN IP
  marquee_port: "8084"
  poll_every: "5s"

esphome:
  name: marquee-panel
  friendly_name: Marquee Panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
logger:
api:
ota:
  - platform: esphome

http_request:
  id: http
  timeout: 8s
  watchdog_timeout: 12s
  useragent: marquee-panel
  verify_ssl: false

output:
  - platform: ledc
    pin: 2
    frequency: 1220Hz
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: 19
  scl: 20
  scan: false

display:
  - platform: rpi_dpi_rgb
    id: panel
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_inverted: true
    dimensions: {width: 800, height: 480}
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red:   [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue:  [15, 7, 6, 5, 4]

font:
  - {file: "gfonts://Oswald", id: font_lg, size: 40}
  - {file: "gfonts://Roboto", id: font_md, size: 26}

lvgl:
  # Start with a single solid screen + one label. Prove it boots first.
  displays:
    - panel
  buffer_size: 25%          # conservative; RGB framebuffer is already in PSRAM
  widgets:
    - obj:
        id: root
        x: 0
        y: 0
        width: 800
        height: 480
        bg_color: 0x101014
        bg_opa: COVER
        pad_all: 0
        border_width: 0
        widgets:
          - label:
              id: boot_label
              align: CENTER
              text: "Marquee panel: LVGL OK"
              text_color: 0xFFFFFF
              text_font: font_md
