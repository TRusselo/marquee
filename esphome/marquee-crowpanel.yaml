# Marquee on CrowPanel Basic HMI 7.0" (ESP32-S3-WROOM-1-N4R8)
# Pull model: the panel polls Marquee's now-playing.json and renders the card.
# Leave Marquee on CAST_TARGET=nest (or unset) -- this panel drives itself.
#
# STATUS: starting sketch. Never run on this hardware. Expect to tune:
#   - the RGB porch/pclk values per your exact unit,
#   - http_request / online_image / json syntax to your ESPHome version.

substitutions:
  marquee_host: "192.168.1.12"     # <-- your Marquee server LAN IP (same as PAGE_URL host)
  marquee_port: "8084"
  poll_every: "5s"

esphome:
  name: marquee-panel
  friendly_name: Marquee Panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # No version pin: ESPHome's recommended IDF is >= 5.4.2 (satisfies i2c) and
    # matches the wifi component. Pinning an exact 5.4.2 broke wifi (coex_background_scan).
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# PSRAM is REQUIRED: 800x480x2 = ~768 KB framebuffer + JPEG decode buffers.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

http_request:
  id: http
  timeout: 8s
  watchdog_timeout: 12s
  useragent: marquee-panel
  verify_ssl: false        # Marquee is plain HTTP on the LAN

# ---------------- CrowPanel Basic 7.0" display hardware ----------------
output:
  - platform: ledc
    pin: 2
    frequency: 1220Hz
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: 19
  scl: 20
  scan: false

# Touch isn't needed for a passive marquee. Uncomment if you want it later:
# touchscreen:
#   - platform: gt911
#     id: touch
#     interrupt_pin: 18      # verify against your unit's schematic

display:
  - platform: rpi_dpi_rgb
    id: panel
    update_interval: never          # we redraw manually after each poll
    auto_clear_enabled: false
    color_order: RGB
    pclk_inverted: true
    dimensions: {width: 800, height: 480}
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red:   [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue:  [15, 7, 6, 5, 4]
    pages:
      - id: page_card
        lambda: |-
          if (!id(now_playing)) { it.fill(Color::BLACK); return; }
          it.fill(Color(8, 8, 12));
          // Poster on the left (fetched via online_image, resized 300x450)
          if (id(poster_img).get_width() > 0)
            it.image(40, 15, id(poster_img));
          // Text column on the right
          const int x = 380;
          it.printf(x, 40,  id(font_title), Color(255,255,255),
                    "%s", id(now_title).c_str());
          if (!id(now_year).empty())
            it.printf(x, 105, id(font_body), Color(170,170,175),
                      "%s", id(now_year).c_str());
          if (!id(now_tagline).empty())
            it.printf(x, 150, id(font_body), Color(205,205,210),
                      "%s", id(now_tagline).c_str());

online_image:
  - id: poster_img
    url: "http://${marquee_host}:${marquee_port}/poster.jpg"
    format: JPEG
    type: RGB565
    resize: 300x450
    update_interval: never          # fetched on demand when a title starts
    on_download_finished:
      # Flag ONLY -- do NOT redraw here. A full panel repaint inside this callback
      # is what crashed the device (op ballooned 2.8s -> 11.6s -> watchdog). The
      # interval below sees the flag and redraws on the next tick, safely.
      - lambda: "id(redraw_pending) = true;"

globals:
  - {id: now_playing,   type: bool, restore_value: no, initial_value: "false"}
  - {id: now_title,     type: std::string, restore_value: no}
  - {id: now_tagline,   type: std::string, restore_value: no}
  - {id: now_year,      type: std::string, restore_value: no}
  # Cross-lambda state: a separate lambda can't see another's locals, so the
  # change-detection signals have to live in globals.
  - {id: prev_title,      type: std::string, restore_value: no}
  - {id: prev_playing,    type: bool, restore_value: no, initial_value: "false"}
  - {id: poster_dirty,    type: bool, restore_value: no, initial_value: "false"}
  - {id: content_changed, type: bool, restore_value: no, initial_value: "false"}
  # Set by online_image's on_download_finished; consumed by the interval to do
  # ONE redraw after the new poster is in memory (never redraw in the callback).
  - {id: redraw_pending,  type: bool, restore_value: no, initial_value: "false"}

font:
  # gfonts:// downloads at compile time (needs internet on the build host).
  - {file: "gfonts://Oswald", id: font_title, size: 44}
  - {file: "gfonts://Roboto", id: font_body,  size: 26}

# ---------------- the poll loop ----------------
interval:
  - interval: ${poll_every}
    then:
      - http_request.get:
          url: "http://${marquee_host}:${marquee_port}/now-playing.json"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject root) -> bool {
                    bool playing = root["playing"] | false;
                    id(now_playing) = playing;
                    if (playing) {
                      id(now_title)   = std::string(root["title"]   | "");
                      id(now_tagline) = std::string(root["tagline"] | "");
                      if (root["year"].is<int>()) {
                        char y[8];
                        snprintf(y, sizeof(y), "%d", (int)(root["year"] | 0));
                        id(now_year) = std::string(y);
                      } else {
                        id(now_year) = std::string("");
                      }
                    }
                    return true;
                  });
                  // Edge detection so we DON'T repaint every poll (that full RGB
                  // repaint is the visible 5s wipe). A new title means a new poster.
                  bool title_changed = id(now_playing) && (id(now_title) != id(prev_title));
                  id(poster_dirty)    = title_changed;
                  id(content_changed) = (id(now_playing) != id(prev_playing)) || title_changed;
                  id(prev_title)   = id(now_title);
                  id(prev_playing) = id(now_playing);
              - if:
                  condition:
                    lambda: "return id(now_playing);"
                  then:
                    # Backlight + poster fetch only on an actual change, not every poll.
                    - if:
                        condition:
                          lambda: "return id(content_changed);"
                        then:
                          - light.turn_on: backlight
                    - if:
                        condition:
                          lambda: "return id(poster_dirty);"
                        then:
                          # Kicks the async download; on_download_finished sets redraw_pending.
                          - component.update: poster_img
                    # Redraw on a content change (text) OR once the new poster lands.
                    - if:
                        condition:
                          lambda: "return id(content_changed) || id(redraw_pending);"
                        then:
                          - lambda: "id(redraw_pending) = false;"
                          - component.update: panel
                  else:
                    # Clear to black + sleep backlight once, on the play->stop edge.
                    - if:
                        condition:
                          lambda: "return id(content_changed);"
                        then:
                          - component.update: panel
                          - light.turn_off: backlight
