# =============================================================================
#  Marquee panel — simple lambda card   (ON-DEVICE render, NO sidecar)
#  Board: Elecrow CrowPanel Basic HMI 7.0"  (ESP32-S3-WROOM-1-N4R8, 800x480 RGB)
# =============================================================================
#  WHAT THIS DOES / WHAT YOU SEE:
#    The panel polls Marquee's now-playing.json every few seconds and draws a
#    simple card with the classic ESPHome display API (it.image / it.printf):
#    the poster on the left, title + year + tagline on the right, on a near-black
#    background. Black screen + backlight off when nothing is playing.
#    This is the lightest on-device method (no LVGL). It reconstructs the card on
#    the ESP — it is NOT a pixel copy of the Nest Hub card. For a pixel-perfect
#    card, use the screenshot sidecar instead (../marquee-crowpanel-shot.yaml).
#
#  REQUIRES: a running Marquee serving, on the LAN:
#    /now-playing.json, /poster.jpg   (Marquee already serves these).
#  Keep Marquee on CAST_TARGET=nest — this panel drives itself, pull-style.
#
#  PER-INSTALL: edit `substitutions` (server IP), the `wifi:` block (secrets +
#  static IP), and confirm the RGB timing/pins match YOUR unit.
# =============================================================================

substitutions:
  marquee_host: "192.168.1.12"     # <-- your Marquee server LAN IP (the PAGE_URL host)
  marquee_port: "8084"
  poll_every: "5s"                 # how often to poll now-playing.json


# =============================================================================
#  PART 1 — ESP32 / CrowPanel HARDWARE
#  Board, memory, radio, console, backlight, touch bus, and the RGB display.
#  This part is the same for every Marquee panel on this board (it matches the
#  LVGL example's PART 1). Only the per-install bits (server IP above, wifi /
#  static IP below) differ.
#  NOTE: the RGB `display:` block lives here as hardware, but for THIS method its
#  `pages: page_card` lambda is also the card renderer (ESPHome requires the draw
#  code inside the display block). That lambda reads the globals defined in PART 2.
# =============================================================================

esphome:
  name: marquee-panel
  friendly_name: Marquee Panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi     # QIO flash + OPI (octal) PSRAM
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # No IDF version pin: ESPHome's recommended IDF (>= 5.4.2) satisfies i2c and
    # the wifi component. (Pinning an exact old version has broken wifi before.)
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y        # octal-PSRAM tuning for this board
      CONFIG_SPIRAM_RODATA: y

# PSRAM is REQUIRED: the 800x480x2 (~768 KB) framebuffer + JPEG decode buffers
# live here. This board is an N4R8 = 8 MB OCTAL PSRAM.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP by default. Optional: pin a static IP so the panel is easy to find for
  # OTA — uncomment and set to YOUR LAN.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

logger:
  # Force UART0 (GPIO43/44 -> CH340 -> /dev/ttyUSB0). ESPHome 2026.7 defaults the
  # console to USB_SERIAL_JTAG, whose pins (GPIO19/20) ARE this board's touch-i2c
  # bus -> i2c init kills the console (and destabilizes the app). UART0 is the
  # stable, non-conflicting channel and carries ROM + bootloader + app together.
  hardware_uart: UART0
api:
ota:
  - platform: esphome

http_request:
  id: http
  timeout: 8s
  watchdog_timeout: 12s
  useragent: marquee-panel
  verify_ssl: false                # Marquee is plain HTTP on the LAN

# Backlight on GPIO2 (dimmable). The poll loop in PART 2 turns it off when idle.
output:
  - platform: ledc
    pin: 2
    frequency: 1220Hz
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

# Capacitive touch (GT911) bus. `scan: false` — not enumerated; touchscreen is
# optional and left disabled for a passive marquee.
i2c:
  sda: 19
  scl: 20
  scan: false

# RGB parallel panel. Porch/pclk values and pin maps are for the Elecrow
# CrowPanel 7.0"; verify against YOUR unit's schematic if colors/timing look off.
display:
  - platform: rpi_dpi_rgb
    id: panel
    update_interval: never         # we redraw manually after each poll (see PART 2)
    auto_clear_enabled: false
    color_order: RGB
    pclk_inverted: true
    dimensions: {width: 800, height: 480}
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red:   [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue:  [15, 7, 6, 5, 4]
    # -- CARD RENDERER (PART-2 logic, but must live inside the display block) --
    # Draws from the globals set by the poll loop below. Called only when we
    # `component.update: panel` (edge-triggered), never every frame.
    pages:
      - id: page_card
        lambda: |-
          if (!id(now_playing)) { it.fill(Color::BLACK); return; }
          it.fill(Color(8, 8, 12));                       // near-black card bg
          if (id(poster_img).get_width() > 0)             // poster on the left
            it.image(40, 15, id(poster_img));
          const int x = 380;                              // text column on the right
          it.printf(x, 40,  id(font_title), Color(255,255,255),
                    "%s", id(now_title).c_str());
          if (!id(now_year).empty())
            it.printf(x, 105, id(font_body), Color(170,170,175),
                      "%s", id(now_year).c_str());
          if (!id(now_tagline).empty())
            it.printf(x, 150, id(font_body), Color(205,205,210),
                      "%s", id(now_tagline).c_str());


# =============================================================================
#  PART 2 — MARQUEE CARD  (application logic)
#  Fonts + shared state + the poster fetch + the poll loop. This is the part that
#  differs between rendering methods; the renderer itself is the display `pages`
#  lambda in PART 1.
# =============================================================================

font:
  # gfonts:// downloads at compile time (needs internet on the build host).
  - {file: "gfonts://Oswald", id: font_title, size: 44}
  - {file: "gfonts://Roboto", id: font_body,  size: 26}

# Poster, fetched on demand (Marquee serves poster.jpg; here resized to 300x450).
online_image:
  - id: poster_img
    url: "http://${marquee_host}:${marquee_port}/poster.jpg"
    format: JPEG
    type: RGB565
    resize: 300x450
    update_interval: never
    on_download_finished:
      # Flag ONLY -- do NOT redraw here. A full panel repaint inside this callback
      # once ballooned to ~11.6 s and tripped the watchdog. The interval below
      # sees the flag and redraws on its next tick, safely.
      - lambda: "id(redraw_pending) = true;"

# Cross-lambda state (a lambda can't see another lambda's locals).
globals:
  - {id: now_playing,   type: bool,        restore_value: no, initial_value: "false"}
  - {id: now_title,     type: std::string, restore_value: no}
  - {id: now_tagline,   type: std::string, restore_value: no}
  - {id: now_year,      type: std::string, restore_value: no}
  - {id: prev_title,      type: std::string, restore_value: no}   # edge-detect title
  - {id: prev_playing,    type: bool, restore_value: no, initial_value: "false"}
  - {id: poster_dirty,    type: bool, restore_value: no, initial_value: "false"}
  - {id: content_changed, type: bool, restore_value: no, initial_value: "false"}
  # Set by online_image on download; consumed by the interval to redraw ONCE
  # after the new poster is in memory (never redraw inside the callback).
  - {id: redraw_pending,  type: bool, restore_value: no, initial_value: "false"}

# The poll loop: fetch now-playing.json, edge-detect changes, and redraw only
# when something actually changed (a blind repaint every poll is the visible
# "wipe/slide" on this direct-scanout RGB panel).
interval:
  - interval: ${poll_every}
    then:
      - http_request.get:
          url: "http://${marquee_host}:${marquee_port}/now-playing.json"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject root) -> bool {
                    bool playing = root["playing"] | false;
                    id(now_playing) = playing;
                    if (playing) {
                      id(now_title)   = std::string(root["title"]   | "");
                      id(now_tagline) = std::string(root["tagline"] | "");
                      if (root["year"].is<int>()) {
                        char y[8];
                        snprintf(y, sizeof(y), "%d", (int)(root["year"] | 0));
                        id(now_year) = std::string(y);
                      } else {
                        id(now_year) = std::string("");
                      }
                    }
                    return true;
                  });
                  // Edge detection: a new title means a new poster to fetch.
                  bool title_changed = id(now_playing) && (id(now_title) != id(prev_title));
                  id(poster_dirty)    = title_changed;
                  id(content_changed) = (id(now_playing) != id(prev_playing)) || title_changed;
                  id(prev_title)   = id(now_title);
                  id(prev_playing) = id(now_playing);
              - if:
                  condition:
                    lambda: "return id(now_playing);"
                  then:
                    - if:                              # backlight on, only on a change
                        condition:
                          lambda: "return id(content_changed);"
                        then:
                          - light.turn_on: backlight
                    - if:                              # fetch the new poster
                        condition:
                          lambda: "return id(poster_dirty);"
                        then:
                          - component.update: poster_img   # -> sets redraw_pending
                    - if:                              # redraw on change OR poster arrival
                        condition:
                          lambda: "return id(content_changed) || id(redraw_pending);"
                        then:
                          - lambda: "id(redraw_pending) = false;"
                          - component.update: panel
                  else:                                # play -> stop: clear + dim, once
                    - if:
                        condition:
                          lambda: "return id(content_changed);"
                        then:
                          - component.update: panel
                          - light.turn_off: backlight
